name: Build Python Wheels for Release

on:
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build ${{ matrix.python }} wheels for ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: [cp310, cp311, cp312, cp313, cp314]
        target:
          - windows
          - macos-arm64
          - macos-x86_64
          - manylinux-x86_64
          - manylinux-aarch64
          - musllinux-x86_64
          - musllinux-aarch64
        include:
          - target: windows
            runner: windows-latest
            archs: AMD64
            build: "win*"
            before_all: ""
            environment: ""
            macos_deployment_target: ""
          - target: macos-arm64
            runner: macos-latest
            archs: arm64
            build: "macosx*"
            before_all: ""
            environment: 'CMAKE_ARGS="-DREGOCPP_VENDOR_OPENSSL=ON"'
            macos_deployment_target: "15.0"
          - target: macos-x86_64
            runner: macos-15-intel
            archs: x86_64
            build: "macosx*"
            before_all: brew install openssl@3
            environment: "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)"
            macos_deployment_target: "15.0"
          - target: manylinux-x86_64
            runner: ubuntu-latest
            archs: x86_64
            build: "manylinux*"
            before_all: dnf makecache && dnf install -y openssl-devel
            environment: ""
            macos_deployment_target: ""
          - target: manylinux-aarch64
            runner: ubuntu-24.04-arm
            archs: aarch64
            build: "manylinux*"
            before_all: dnf makecache && dnf install -y openssl-devel
            environment: ""
            macos_deployment_target: ""
          - target: musllinux-x86_64
            runner: ubuntu-latest
            archs: x86_64
            build: "musllinux*"
            before_all: apk add openssl-dev
            environment: ""
            macos_deployment_target: ""
          - target: musllinux-aarch64
            runner: ubuntu-24.04-arm
            archs: aarch64
            build: "musllinux*"
            before_all: apk add openssl-dev
            environment: ""
            macos_deployment_target: ""

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Git config for fetching pull requests
        run: |
          git config --global --add remote.origin.fetch +refs/pull/*/merge:refs/remotes/pull/*

      - name: Build wheels
        uses: pypa/cibuildwheel@4726cd35bb13f7bde50cf2761f2499ac7b3aa32c # v4.1.1
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
          CIBW_BEFORE_ALL: ${{ matrix.before_all }}
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.build }}
          CIBW_ENVIRONMENT: >
            REGOCPP_REPO=https://github.com/${{github.repository}}
            REGOCPP_TAG=${{github.sha}}
            ${{ matrix.environment }}
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_34
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_34
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
        with:
          package-dir: ${{github.workspace}}/wrappers/python/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.python }}-${{ matrix.target }}
          path: ./wheelhouse/*.whl

  # Dlopen musllinux wheels in python:X-alpine; auditwheel skips load-time.
  smoke_test_musllinux:
    name: Smoke test ${{ matrix.python }} musllinux wheel (${{ matrix.target }})
    needs: build_wheels
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: [cp310, cp311, cp312, cp313, cp314]
        target: [musllinux-x86_64, musllinux-aarch64]
        include:
          - target: musllinux-x86_64
            runner: ubuntu-latest
          - target: musllinux-aarch64
            runner: ubuntu-24.04-arm
          - python: cp310
            python_tag: "3.10-alpine"
          - python: cp311
            python_tag: "3.11-alpine"
          - python: cp312
            python_tag: "3.12-alpine"
          - python: cp313
            python_tag: "3.13-alpine"
          - python: cp314
            python_tag: "3.14-alpine"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheels-${{ matrix.python }}-${{ matrix.target }}
          path: wheelhouse

      - name: Import regopy inside python:${{ matrix.python_tag }}
        run: |
          set -euo pipefail
          ls -la wheelhouse
          wheel_count=$(find wheelhouse -maxdepth 1 -name 'regopy-*.whl' | wc -l)
          if [ "$wheel_count" -ne 1 ]; then
            echo "Expected exactly one regopy wheel, found $wheel_count"; exit 1
          fi
          docker run --rm \
            -v "$PWD/wheelhouse:/wheels:ro" \
            -v "$PWD/.github/scripts:/scripts:ro" \
            "python:${{ matrix.python_tag }}" sh -euxc '
              pip install --no-index /wheels/regopy-*.whl
              python3 /scripts/smoke_test_musllinux_wheel.py
            '

  merge:
    needs: [build_wheels, smoke_test_musllinux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: wheelhouse
          pattern: wheels-*
          merge-multiple: true
      - run: ls -R wheelhouse
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels
          path: ./wheelhouse/*
